<!doctype html><html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,300..600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;width:1200px;height:630px;background:#181a20;color:#f2f0ec}
  .pad{position:absolute;inset:64px 72px;display:flex;flex-direction:column;justify-content:space-between}
  .top{display:flex;justify-content:space-between;align-items:baseline;font-family:Inter,sans-serif;font-size:20px}
  .brand{display:flex;align-items:center;gap:12px}
  .mark{display:grid;place-items:center;width:34px;height:34px;border-radius:9px;
        background:linear-gradient(155deg,#ab4dff,#9c27ff 48%,#8517e2);color:#14161b;
        font-family:Newsreader,Georgia,serif;font-size:29px;line-height:1;padding-top:5px}
  .name{font-family:Newsreader,Georgia,serif;font-size:26px;letter-spacing:-.012em}
  .meta{color:#9b99a4;font-family:ui-monospace,Menlo,monospace;font-size:15px;letter-spacing:.06em}
  h1{margin:0;font-family:Newsreader,Georgia,serif;font-weight:400;font-size:76px;line-height:1.03;letter-spacing:-.022em;max-width:900px}
  .rule{height:1px;background:#33363f;margin:34px 0 26px}
  .foot{display:flex;justify-content:space-between;align-items:flex-end;font-family:Inter,sans-serif;font-size:19px;color:#c3c1c9}
  .dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#9c27ff;margin-right:10px;vertical-align:1px}
  .mono{font-family:ui-monospace,Menlo,monospace;font-size:14px;color:#9b99a4;letter-spacing:.05em}
</style></head><body><div class="pad">
  <div class="top"><span class="brand"><span class="mark">J</span><span class="name">Jeevitha <span style="color:#9b99a4">Venkatesan</span></span></span><span class="meta">BENGALURU · INDIA</span></div>
  <div>
    <h1>I build products that work reliably, not just features that ship.</h1>
    <div class="rule"></div>
    <div class="foot">
      <span><span class="dot"></span>Senior Full-Stack Engineer — 5.6 years</span>
      <span class="mono">jeevitha137.github.io</span>
    </div>
  </div>
</div></body></html>
